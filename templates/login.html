{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
  <h1>Log in</h1>
  <form method="post">
    <label>Username <input name="username" required autofocus></label><br>
    <label>Password <input type="password" name="password" required></label><br>
    <button type="submit">Log in</button>
  </form>
{% endblock %}
