{% extends "base.html" %}
{% block title %}Log in · Office Hours{% endblock %}
{% block content %}
  <section class="card auth">
    <h1>Welcome back</h1>
    <p class="muted">Log in to manage your office hours.</p>

    <form method="post" class="form">
      <div class="field">
        <label for="username">Username or email</label>
        <input id="username" name="username" value="{{ username }}" autocomplete="username" required {% if not username %}autofocus{% endif %}>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input id="password" type="password" name="password" autocomplete="current-password" required {% if username %}autofocus{% endif %}>
          <button type="button" class="toggle-password" data-target="password" aria-label="Show password">Show</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>

    <p class="switch">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
  </section>
  {% include "_password_toggle.html" %}
{% endblock %}
